version: "3"

vars:
  SANDBOX: "{{.ROOT_DIR}}/.sandbox"

tasks:
  default: task --list-all

  test:
    desc: Apply the dotfiles into a sandbox HOME (scripts excluded) and verify
    env:
      HOME: "{{.SANDBOX}}"
    cmds:
      - rm -rf "{{.SANDBOX}}"
      - chezmoi init --apply --source . --promptDefaults --no-tty --exclude scripts
      - chezmoi verify --source . --exclude scripts
      - 'echo "Sandbox applied successfully in {{.SANDBOX}}."'

  diff:
    desc: Show what chezmoi apply would change in the real HOME
    cmd: chezmoi diff
