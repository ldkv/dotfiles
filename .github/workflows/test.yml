name: Test chezmoi apply
on:
  pull_request:
  push:
    branches:
      - "main"

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install chezmoi
        if: runner.os != 'Windows'
        run: |
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install scoop and chezmoi
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          iex "& {$(irm get.scoop.sh)} -RunAsAdmin"
          "$HOME\scoop\shims" >> $env:GITHUB_PATH
          "$HOME\.local\bin" >> $env:GITHUB_PATH
          & "$HOME\scoop\shims\scoop.ps1" install chezmoi

      - name: Apply dotfiles
        run: chezmoi init --apply --source "${{ github.workspace }}" --promptDefaults --no-tty

      - name: Fix insecure completion directories
        if: runner.os != 'Windows'
        shell: bash
        run: |
          insecure=$(zsh -i -c 'autoload -Uz compaudit && compaudit' </dev/null 2>/dev/null || true)
          echo "Insecure directories: ${insecure:-none}"
          [ -z "$insecure" ] || echo "$insecure" | xargs sudo chmod g-w,o-w

      - name: Check zsh starts without errors
        if: runner.os != 'Windows'
        shell: bash
        run: |
          err=$(zsh -i -c exit 2>&1 >/dev/null)
          [ -z "$err" ] || { echo "$err"; exit 1; }

      - name: Check PowerShell profile loads without errors
        if: runner.os == 'Windows'
        shell: pwsh -NoProfile -NonInteractive -Command ". '{0}'"
        run: |
          # scoop updates PATH and PSModulePath in the registry, reload them like a new terminal would
          $env:Path = [Environment]::GetEnvironmentVariable("Path", "User") + ";" + $env:Path
          $env:PSModulePath = [Environment]::GetEnvironmentVariable("PSModulePath", "User") + ";" + $env:PSModulePath
          $ErrorActionPreference = "Stop"
          . $PROFILE
